name: Pliki do druku

# Uruchamiane ręcznie: Actions → Pliki do druku → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Wygeneruj PDF
        continue-on-error: true
        run: |
          python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          curl -sS -m 60 -o /dev/null -w "WMS GetCapabilities: %{http_code} w %{time_total}s\n" "https://gis1.um.wroc.pl/arcgis/services/ogc/OGC_mpodst/MapServer/WmsServer?service=WMS&request=GetCapabilities" >> diag.txt 2>&1 || echo "WMS curl blad" >> diag.txt
          node tools/drukuj_ci.js >> diag.txt 2>&1 || echo "skrypt zakonczony bledem" >> diag.txt
          mkdir -p wydruk && cp diag.txt wydruk/diag.txt
      - name: Zapisz PDF na gałęzi wydruk (main bez zmian)
        if: hashFiles('wydruk/plakat-2xA4.pdf') != '' && hashFiles('wydruk/plakat-A3.pdf') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r wydruk /tmp/wydruk
          git checkout --orphan wydruk
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/wydruk/* .
          git add -A
          git commit -m "Pliki do druku $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin wydruk
